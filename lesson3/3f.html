<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .add {
            background-color: yellow;
            padding: 10px;
            padding-left: 25px;
            padding-right: 25px;
            font-size: large;
            border: 1px solid yellow;
            border-radius: 20px;
            font-weight: 200px;
            cursor: pointer;
        }

        .add:hover {
            background-color: rgb(247, 202, 0);
        }

        .add:active {
            opacity: 0.5;
        }

        .buy {
            background-color: rgb(255, 164, 28);
            padding: 10px;
            padding-left: 25px;
            padding-right: 25px;
            font-size: large;
            border: 1px solid rgb(255, 164, 28);
            border-radius: 20px;
            font-weight: 200px;
            margin-left: 20px;
            cursor: pointer;
        }

        .buy:hover {
            background-color: rgb(250, 137, 0);
        }

        .buy:active {
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <a href="index.html">back to google</a>

    <h1 style="font-weight: bold;">Nike Black Running Shoes</h1>

    <p style="color: green; font-size: 20px;">
        $39 - in stock
    </p>

    <p style="font-size: 20px;">
        Free Delivery Tomorrow
    </p>

    <button class="add">Add to cart</button>
    <button class="buy">Buy Now</button>

</body>
</html>
