
<!DOCTYPE html><html lang="en">
<head>
<style>
    .git-btn {
      width: 90px;
      height: 40px;

      border: 0;
      border-radius: 6px;

      background: #2ea44f;
      color: #fff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition: box-shadow 0.2s ease;
    }

    .git-btn:hover {
      box-shadow: 0 5px 8px rgba(0, 0, 0, 0.15);
    }
</style>
</head>

<body>

  <button class="git-btn">Github</button>

</body>
</html>
