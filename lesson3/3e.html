
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .get {
            padding: 15px 40px;
            background-color: rgb(10, 102, 194);
            color: white;
            border: 1px solid rgb(46, 139, 227);
            border-radius: 25px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .get:hover {
            background-color: rgb(2, 70, 138);
        }

        .down {
            padding: 15px 40px;
            background-color: white;
            color: rgb(23, 108, 189);
            border: 1px solid rgb(10, 102, 194);
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            margin-left: 20px;
            cursor: pointer;
            transition: background-color 0.15s ease,
                        border-width 0.15s ease;
        }

        .down:hover {
            background-color: rgb(226, 240, 254);
            border-width: 2px;
        }
    </style>
</head>

<body>

    <button class="get">Apply on company website</button>
    <button class="down">Save</button>

</body>
</html>
