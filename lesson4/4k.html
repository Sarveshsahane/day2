<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        .menu-btn {
            margin: 0 10px;
            padding: 8px 15px;
            border: 0;
            background-color: green;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: padding 0.15s ease, margin 0.15s ease;
        }

        .menu-btn:hover {
            margin-left: 0;
            margin-right: 0;
            padding-left: 25px;
            padding-right: 25px;
        }
    </style>
</head>

<body>
    <button class="menu-btn">One</button> 
    <button class="menu-btn">Two</button> 
    <button class="menu-btn">Three</button>
</body>

</html>
