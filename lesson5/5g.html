<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .post-number {
            position: absolute;
            top: 12px;
            left: 38px;
            color: white;
            font-size: 52px;
            font-weight: bold;
        }

        .post {
            width: 88%;
            margin-left: 8%;
            margin-top: 15px;
            padding: 18px 20px 35px;
            background-color: white;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .username {
            font-size: 38px;
            font-weight: bold;
        }

        .handle {
            color: rgb(100, 100, 100);
            font-size: 38px;
        }

        .time {
            color: rgb(80, 80, 80);
            font-size: 30px;
        }

        .text {
            font-size: 43px;
            line-height: 1.6;
            margin: 0;
        }

        .mention {
            color: rgb(70, 145, 225);
        }

        .second-line {
            margin-top: 35px;
        }
    </style>
</head>

<body>

    <div class="post">

        <div class="header">
            <span class="username">freeCodeCamp.org</span>
            <span class="handle">@freeCodeCamp</span>
            <span class="time">1h</span>
        </div>

        <p class="text">
            As a web developer, you'll want to make your projects easy to use and
            <br>
            navigate around.
        </p>

        <p class="text second-line">
            Here <span class="mention">@chp_it</span> outlines the top skills new developers should have.
        </p>

    </div>

</body>
</html>
