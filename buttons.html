<!DOCTYPE html>
<html lang="en">
<head>
<title>Document</title>


<style>
.subscriber-button {
    background-color:red; 
        border: none;
        color: white;
        height: 36px;
        width: 105px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
    }
    .join-button{
        background-color:white;
        border-color: rgb(41, 56, 78); 
        border-style: solid;
        border-width: 2px;
        color: rgb(9, 2, 2);
        height: 36px;
        width: 105px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
    }
    .tweet-button{
        background-color: rgb(241, 238, 243);
        border-color: purple;
        color: purple;
        border-radius: 2px;
        cursor: pointer;
        border-style: solid;
        
    }

</style>


</head>
<body>
    <button class="subscriber-button">Subscribe</button>
    <button class="tweet-button">Tweet</button>
    <button class="join-button">Join</button>

</body>
</html>
